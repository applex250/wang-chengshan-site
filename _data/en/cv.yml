    研究方向:
      - name: Tibetan Plateau Uplift and Sedimentary Response
        summary: Reconstruction of plateau uplift processes, sediment–tectonics coupling, and the "proto-Tibetan Plateau" uplift model

      - name: Deep-time Paleoclimate and Paleoceanography
        summary: Cretaceous oceanic red beds, greenhouse climates, continental scientific drilling, deep-time digital Earth

      - name: Sedimentology and Tectonics
        summary: Sedimentary basin analysis, Cretaceous continental scientific drilling in the Songliao Basin

      - name: Big-data Sedimentology
        summary: Cyclostratigraphy, Earth's rotation rhythms, and the intersection of astronomical cycles with sedimentary records

