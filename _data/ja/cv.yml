        location: 四川省・成都
        start_date: 1991
        end_date: 2001
        highlights:
          - 1991年4月〜2001年9月まで副学長を務める

      - company: 米国地質調査所（USGS）
        position: 客員研究員
        start_date: 1993
        end_date: 1994

      - company: 成都理工大学
        position: 学長
        location: 四川省・成都
        start_date: 2001
        end_date: 2003
        highlights:
          - 2001年9月に学長に就任

      - company: 西南科技大学
        position: 教授
        location: 四川省・綿陽
        start_date: 2003
        end_date: 2004

      - company: 中国地質大学（北京）
        position: 教授・博士課程指導教官
        location: 北京
        start_date: 2005
        end_date: 現在
        highlights:
          - 2005年より地球科学・資源学院で教鞭を執る

    学术兼职与项目:
      - company: 国際大陸科学掘削計画（ICDP）
        position: 松遼盆地国際大陸科学掘削プロジェクト 首席科学者
        summary: 20年にわたる松遼盆地国際大陸科学掘削プロジェクトを主導し、2025年度国家科学技術進歩賞一等賞を受賞。

      - company: 深時デジタル地球（DDE）国際大科学計画
        position: 執行委員会主席
        summary: IUGSが認定する初の国際大科学計画「Deep-time Digital Earth（深時デジタル地球）」を主導的に提唱し、地球進化データのグローバルな統合と共有を推進。

      - company: 『地球科学の地平線（Earth Science Horizons, ESH）』
        position: 創刊編集長
        start_date: 2026
        summary: 欧州地球科学連合（EGU）の創設者らと共同で創設した地球科学レビュー誌であり、TRAC学術原則（透明性・再現性・主体責任・明確性）を初めて提唱。

      - company: 国家重点基礎研究発展計画（973計画）
        position: 首席科学者（2件）
        summary: 国家「973」プロジェクト2件の首席科学者を務める。

      - company: ユネスコ国際地球科学計画（IGCP）
        position: プロジェクト主席（IGCP 463、555）
        summary: UNESCO/IUGS の IGCP プロジェクト2件で主席を務める。

