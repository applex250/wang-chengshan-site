cv:
  name: 王成善
  headline: 中国科学院院士・地質学者・堆積学者
  email: wangchengshan@cdut.edu.cn # 実際のメールアドレスに置き換えてください
  location: 北京市海淀区学院路29号, 中国地質大学（北京）100083

  custom_connections:
    - fontawesome_icon: building-columns
      placeholder: 中国地質大学（北京）
      url: https://www.cugb.edu.cn/
    - fontawesome_icon: building-columns
      placeholder: 成都理工大学
      url: https://www.cdut.edu.cn

  sections:
    个人简介:
      - 1951年11月、黒竜江省ハルビン市生まれ。地質学者・堆積学者であり、中国科学院院士（2013年選出）、中国地質大学（北京）教授・博士課程指導教官。主に堆積学と大地構造学を研究し、チベット高原の隆起、深時古気候学と古海洋学を重点的に探求。松遼盆地国際大陸科学掘削プロジェクトを主導し、「深時デジタル地球（DDE）」国際大科学計画を率先して発起した。

    教育经历:
      - institution: 成都地質学院（現 成都理工大学）
        location: 四川省・成都
        area: 地質学科 鉱床探査学科
        degree: 学士
        start_date: 1974
        end_date: 1977
        highlights:
          - 1977年に鉱床探査学科を卒業

      - institution: 成都地質学院（現 成都理工大学）
        location: 四川省・成都
        area: 地質学科
        degree: 修士
        start_date: 1978
        end_date: 1981
        highlights:
          - 1981年に地質学修士号を取得

    工作经历:
      - company: チベット・昌都（チャムド）工業局
        position: 地質班技術員
        start_date: 1977
        end_date: 1978

      - company: 成都地質学院（現 成都理工大学）
        position: 教員（母校に留任）
        location: 四川省・成都
        start_date: 1981
        end_date: 2003
        summary: 1981年に母校に留まって教鞭を執り、長年にわたり堆積学と大地構造の教育・研究に従事。

      - company: 成都地質学院
        position: 堆積地質研究所所長
        location: 四川省・成都
