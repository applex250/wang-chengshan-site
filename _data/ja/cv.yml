    研究方向:
      - name: チベット高原の隆起と堆積応答
        summary: 高原隆起プロセスの復元、堆積―構造のカップリング、「原チベット高原」隆起モデル

      - name: 深時古気候と古海洋学
        summary: 白亜紀海洋レッドベッド、温室気候、大陸科学掘削、深時デジタル地球

      - name: 堆積学と大地構造
        summary: 堆積盆地解析、松遼盆地白亜系大陸科学掘削

      - name: ビッグデータ堆積学
        summary: サイクル層序学、地球自転リズム、天文サイクルと堆積記録の交差研究

