cv:
  name: 왕성산
  headline: 중국과학원 원사 · 지질학자 · 퇴적학자
  email: wangchengshan@cdut.edu.cn # 실제 이메일 주소로 교체하세요
  location: 베이징시 하이뎬구 쉐위안로 29호, 중국지질대학(베이징) 100083

  custom_connections:
    - fontawesome_icon: building-columns
      placeholder: 중국지질대학(베이징)
      url: https://www.cugb.edu.cn/
    - fontawesome_icon: building-columns
      placeholder: 청두이공대학
      url: https://www.cdut.edu.cn

  sections:
    个人简介:
      - 1951년 11월 헤이룽장성 하얼빈 출생. 지질학자이자 퇴적학자로, 중국과학원 원사(2013년 선출)이며 중국지질대학(베이징) 교수·박사과정 지도교수이다. 주로 퇴적학과 대지구조를 연구하며, 티베트 고원 융기, 심층고기후(deep-time paleoclimate)와 고해양학을 중점 탐구했다. 쑹랴오 분지 국제 대륙과학시추 프로젝트를 이끌었고, '심층 디지털 지구(DDE)' 국제 대과학 계획을 주도적으로 발기했다.

    教育经历:
      - institution: 청두지질학원(현 청두이공대학)
        location: 쓰촨성 청두
        area: 지질학과 광상탐사학과
        degree: 학사
        start_date: 1974
        end_date: 1977
        highlights:
          - 1977년 광상탐사학과 학사 졸업

      - institution: 청두지질학원(현 청두이공대학)
        location: 쓰촨성 청두
        area: 지질학과
        degree: 석사
        start_date: 1978
        end_date: 1981
        highlights:
          - 1981년 지질학 석사 학위 취득

    工作经历:
      - company: 티베트 창두시 공업국
        position: 지질팀 기술원
        start_date: 1977
        end_date: 1978

      - company: 청두지질학원(현 청두이공대학)
        position: 교원(학교 잔류)
        location: 쓰촨성 청두
        start_date: 1981
        end_date: 2003
        summary: 1981년 졸업 후 학교에 남아 교편을 잡고 퇴적학과 대지구조의 교육·연구에 오래 종사했다.

      - company: 청두지질학원
        position: 퇴적지질연구소 소장
        location: 쓰촨성 청두
        start_date: 1987
        end_date: 1991
        highlights:
          - 1987년 9월부터 소장으로 재임

      - company: 청두이공대학
        position: 부총장
        location: 쓰촨성 청두
        start_date: 1991
        end_date: 2001
        highlights:
          - 1991년 4월~2001년 9월 부총장 재임

      - company: 미국 지질조사국(USGS)
        position: 객원 연구자
        start_date: 1993
        end_date: 1994

      - company: 청두이공대학
        position: 총장
        location: 쓰촨성 청두
        start_date: 2001
        end_date: 2003
        highlights:
          - 2001년 9월 총장 취임

      - company: 시난과학기술대학
        position: 교수
        location: 쓰촨성 몐양
        start_date: 2003
        end_date: 2004

      - company: 중국지질대학(베이징)
        position: 교수·박사과정 지도교수
        location: 베이징
        start_date: 2005
        end_date: 현재
        highlights:
          - 2005년부터 지구과학·자원학원에서 교수

    学术兼职与项目:
      - company: 국제 대륙과학시추계획(ICDP)
        position: 쑹랴오 분지 국제 대륙과학시추 프로젝트 수석과학자
        summary: 20년에 걸친 쑹랴오 분지 국제 대륙과학시추 프로젝트를 주도해 2025년도 국가과학기술진보상 1등상을 수상했다.

      - company: 심층 디지털 지구(DDE) 국제 대과학 계획
        position: 집행위원회 의장
        summary: IUGS가 인증한 첫 국제 대과학 계획 '심층 디지털 지구(Deep-time Digital Earth)'를 주도적으로 발기하여 지구 진화 데이터의 글로벌 통합과 공유를 추진했다.

      - company: 『지구과학 지평선』(Earth Science Horizons, ESH)
        position: 창간 주편집자
        start_date: 2026
        summary: 유럽지구과학연맹(EGU) 창립자들과 공동으로 창간한 지구과학 리뷰 학술지이며, TRAC 학술 원칙(투명성, 재현성, 주체 책임, 명확성)을 처음 제안했다.

      - company: 국가 중점기초연구발전계획(973계획)
        position: 수석과학자(2건)
        summary: 국가 '973' 프로젝트 2건의 수석과학자로 활동했다.

      - company: 유네스코 국제지구과학계획(IGCP)
        position: 프로젝트 의장(IGCP 463, 555)
        summary: UNESCO/IUGS IGCP 프로젝트 2건의 의장을 맡았다.

      - company: 국제퇴적학회(IAS)
        position: 부회장

      - company: 교육부 과학기술위원회
        position: 지구과학·자원환경 학부 부주임

      - company: 중국과학원
        position: 지질학부 상무위원회 위원

      - company: 중국지질학회
        position: 지질교육분회 회장

      - company: 국제 대륙과학시추 중국위원회
        position: 부주석

      - company: 중국 티베트고원연구회
        position: 상무이사

      - company: 『퇴적학보』
        position: 주편집자

