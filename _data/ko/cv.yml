        date: 1996
        summary: 국가자연과학기금위원회 우수청년과학기금 지원을 받음

      - name: 중국 청년과학기술상
        date: 1991
        summary: 중국과학기술협회 등 수여

    研究方向:
      - name: 티베트 고원 융기와 퇴적 반응
        summary: 고원 융기 과정 복원, 퇴적-구조 커플링, '원시 티베트 고원' 융기 모델

      - name: 심층고기후와 고해양학
        summary: 백악기 해양 적층(red beds), 온실 기후, 대륙 과학시추, 심층 디지털 지구

      - name: 퇴적학과 대지구조
        summary: 퇴적분지 분석, 쑹랴오 분지 백악계 대륙 과학시추

      - name: 빅데이터 퇴적학
        summary: 층서(cyclostratigraphy), 지구 자전 리듬, 천문 주기와 퇴적 기록의 교차 연구

    语言:
      - name: 중국어
