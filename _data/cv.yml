cv:
  name: 王成善
  headline: 中国科学院院士 · 地质学家 · 沉积学家
  email: wangchengshan@cdut.edu.cn # 请替换为真实邮箱
  location: 北京市海淀区学院路29号, 中国地质大学(北京) 100083

  custom_connections:
    - fontawesome_icon: building-columns
      placeholder: 中国地质大学（北京）
      url: https://www.cugb.edu.cn/
    - fontawesome_icon: building-columns
      placeholder: 成都理工大学
      url: https://www.cdut.edu.cn

  sections:
    个人简介:
      - 1951年11月生，黑龙江哈尔滨人，地质学家、沉积学家，中国科学院院士（2013年当选），中国地质大学（北京）教授、博士生导师。主要从事沉积学与大地构造研究，重点探索青藏高原隆升、深时古气候与古海洋学，牵头完成松辽盆地国际大陆科学钻探项目工程，主导发起"深时数字地球（DDE）"国际大科学计划。

    教育经历:
      - institution: 成都地质学院（现成都理工大学）
        location: 四川 · 成都
        area: 地质系 找矿系
        degree: 本科
        start_date: 1974
        end_date: 1977
        highlights:
          - 1977年本科毕业于找矿系

      - institution: 成都地质学院（现成都理工大学）
        location: 四川 · 成都
        area: 地质系
        degree: 硕士
        start_date: 1978
        end_date: 1981
        highlights:
          - 1981年获地质学硕士学位

    工作经历:
      - company: 西藏昌都工业局
        position: 地质组技术员
        start_date: 1977
        end_date: 1978

      - company: 成都地质学院（现成都理工大学）
        position: 任教（留校）
        location: 四川 · 成都
        start_date: 1981
        end_date: 2003
        summary: 1981年留校任教，长期从事沉积学与大地构造教学科研工作。

      - company: 成都地质学院
        position: 沉积地质研究所所长
        location: 四川 · 成都
        start_date: 1987
        end_date: 1991
        highlights:
          - 1987年9月起任所长

      - company: 成都理工大学
        position: 副校长
        location: 四川 · 成都
        start_date: 1991
        end_date: 2001
        highlights:
          - 1991年4月—2001年9月任副校长

      - company: 美国地质调查局（USGS）
        position: 访问学者
        start_date: 1993
        end_date: 1994

      - company: 成都理工大学
        position: 校长
        location: 四川 · 成都
        start_date: 2001
        end_date: 2003
        highlights:
          - 2001年9月任校长

      - company: 西南科技大学
        position: 教授
        location: 四川 · 绵阳
        start_date: 2003
        end_date: 2004

      - company: 中国地质大学（北京）
        position: 教授、博士生导师
        location: 北京
        start_date: 2005
        end_date: 至今
        highlights:
          - 2005年起任教于地球科学与资源学院

    学术兼职与项目:
      - company: 国际大陆科学钻探计划（ICDP）
        position: 松辽盆地国际大陆科学钻探项目工程 首席科学家
        summary: 牵头完成历时20年的松辽盆地国际大陆科学钻探项目工程，获2025年度国家科学技术进步奖一等奖。

      - company: 深时数字地球（DDE）国际大科学计划
        position: 执行委员会主席
        summary: 主导发起由IUGS认证的首个国际大科学计划"深时数字地球（Deep-time Digital Earth）"，推动地球演化数据的全球整合与共享。

      - company: 国家重点基础研究发展计划（973计划）
        position: 首席科学家（两项）
        summary: 担任两项国家"973"项目首席科学家。

      - company: 联合国教科文组织地球科学计划（IGCP）
        position: 项目主席（IGCP 463、555）
        summary: 担任两项 UNESCO/IUGS IGCP 项目主席。

      - company: 国际沉积学家协会（IAS）
        position: 副主席

      - company: 教育部科学技术委员会
        position: 地学与资源环境学部副主任

