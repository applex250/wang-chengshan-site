    研究方向:
      - name: 青藏高原隆升与沉积响应
        summary: 高原隆升过程重建、沉积—构造耦合、"原西藏高原"隆升模式

      - name: 深时古气候与古海洋学
        summary: 白垩纪大洋红层、温室气候、大陆科学钻探、深时数字地球

      - name: 沉积学与大地构造
        summary: 沉积盆地分析、松辽盆地白垩系大陆科学钻探

      - name: 大数据沉积学
        summary: 旋回地层学、地球自转节律、天文旋回与沉积记录交叉

    语言:
