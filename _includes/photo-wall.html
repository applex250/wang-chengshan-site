<!-- 照片墙(全站常驻背景,2026-08 改造):
     DOM 移出 #swup 容器 → 切换页面永不重建、滚动动画永不重启、
     图片首次加载后常驻内存,切回首页零抽动。
     显示与否由 body.photo-wall-active 控制(默认隐藏,仅首页显示),
     见 _sass/_photo-wall.scss。 -->
<div class="photo-wall" aria-hidden="true">
  <div class="photo-wall-track">
    {% for copy in (0..1) %} {% for p in site.data.photo_wall %}
    <figure class="pw-item" style="--w: {{ p.w }}px; --y: {{ p.y }}px; --rot: {{ p.rot }}deg; --blur: {{ p.blur }}px; --z: {{ p.z }}; --o: {{ p.o }}">
      <img src="{{ '/assets/img/wall/' | append: p.file | relative_url }}" alt="" decoding="async" draggable="false" />
    </figure>
    {% endfor %} {% endfor %}
  </div>
</div>
