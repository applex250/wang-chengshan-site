name: Prettier code formatter

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

jobs:
  check:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
      - name: Install dependencies 💾
        # Use the project's pinned prettier (from package-lock) instead of
        # installing latest, so CI formatting rules match local `npm run lint:prettier`.
        run: npm ci --ignore-scripts
      - name: Prettier Check 🔎
        id: prettier
        # --ignore-path 会替换默认 [.gitignore, .prettierignore],故在仓库根动态合并
        # .gitignore + .prettierignore + 追加 .hermes/plans/(ignore 相对路径按文件位置解析,
        # 必须放仓库根;CI 跳过计划文档,本地 npx prettier . --check 仍检查)
        run: |
          cat .gitignore .prettierignore > .ci-ignore.tmp
          echo ".hermes/plans/" >> .ci-ignore.tmp
          npx prettier . --check --ignore-path .ci-ignore.tmp
      - name: Create diff 📝
        # https://docs.github.com/en/actions/learn-github-actions/expressions#failure
        if: ${{ failure() }}
        run: |
          cat .gitignore .prettierignore > .ci-ignore.tmp
          echo ".hermes/plans/" >> .ci-ignore.tmp
          npx prettier . --write --ignore-path .ci-ignore.tmp
          rm -f .ci-ignore.tmp
          git diff -- . ':(exclude)package-lock.json' ':(exclude)package.json' > diff.txt
          npm install -g diff2html-cli
          diff2html -i file -s side -F diff.html -- diff.txt
      - name: Upload html diff ⬆️
        id: artifact-upload
        if: ${{ failure() && steps.prettier.conclusion == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: HTML Diff
          path: diff.html
          retention-days: 7
      - name: Dispatch information to repository 🗣️
        if: ${{ failure() && steps.prettier.conclusion == 'failure' && github.event_name == 'pull_request' }}
        uses: peter-evans/repository-dispatch@v2
        with:
          event-type: prettier-failed-on-pr
          client-payload: '{"pr_number": "${{ github.event.number }}", "artifact_url": "${{ steps.artifact-upload.outputs.artifact-url }}", "run_id": "${{ github.run_id }}"}'
